<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Media-paired metas so the correct bar tint exists at parse time (an empty
      `content` reads as "no color" and white bars can stick for the session). The
      colors + storage key below DUPLICATE src/theme/types.ts on purpose — this
      script runs pre-paint and cannot import; the copy is locked by
      src/theme/themeBootSync.test.ts. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#bfd6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1520" />
    <!-- viewport-fit=cover: page background reaches under the notch; the app shell
      keeps clear of the cutout via env(safe-area-inset-*) (App.module.scss). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>CAROUSEL</title>
    <script>
      (() => {
        const COLORS = { light: "#bfd6f8", dark: "#0d1520" };
        const STORAGE_KEY = "theme-mode";

        let mode = "auto";
        try {
          mode = localStorage.getItem(STORAGE_KEY) || "auto";
        } catch {
          /* storage unavailable -> auto */
        }
        // Validate: anything but an explicit choice is auto (a garbage entry
        // would yield an invalid color and white bars).
        const isExplicit = mode === "light" || mode === "dark";
        const theme = isExplicit
          ? mode
          : window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";

        const root = document.documentElement;
        root.setAttribute("data-theme", theme);
        // Paint-critical: the chrome also samples the page background pre-stylesheet
        // on a cold load, so pin it inline (ThemeProvider keeps it in sync later).
        root.style.backgroundColor = COLORS[theme];

        if (isExplicit) {
          // An explicit choice overrides the media-paired defaults on both metas.
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach((meta) => meta.setAttribute("content", COLORS[theme]));
        }
      })();
    </script>
    <script type="module" crossorigin src="/CarouselCC/assets/index-Br5ny3dC.js"></script>
    <link rel="stylesheet" crossorigin href="/CarouselCC/assets/index-D1oTNu_2.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
