<!doctype html>

    <!--
      The theme boot (media-paired theme-color metas + the pre-paint inline
      script) is injected below at dev/build time by the `theme-boot-inline`
      Vite plugin from the shared module `src/shared/themeBoot.ts`, with the

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#bfd6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1520" />
    <script>(function applyThemeBoot(colors, storageKey) {
	let mode = "auto";
	try {
		mode = localStorage.getItem(storageKey) || "auto";
	} catch {}
	const isExplicit = mode === "light" || mode === "dark";
	const theme = isExplicit ? mode : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
	const color = theme === "dark" ? colors.dark : colors.light;
	const root = document.documentElement;
	root.setAttribute("data-theme", theme);
	root.style.backgroundColor = color;
	if (isExplicit) {
		const metas = document.querySelectorAll("meta[name=\"theme-color\"]");
		for (let index = 0; index < metas.length; index += 1) metas[index].setAttribute("content", color);
	}
})({"light":"#bfd6f8","dark":"#0d1520"}, "theme-mode");</script>
