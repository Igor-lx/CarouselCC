<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The theme boot (media-paired theme-color metas + the pre-paint inline
      script) is injected below at dev/build time by the `theme-boot-inline`
      Vite plugin from the shared module `src/shared/themeBoot.ts`, with the
      colors defined once in `src/theme/types.ts`. It stays a PARSE-TIME
      inline script on purpose: a runtime module import is deferred past the
      first paint, and mobile browsers commit the bar tint (incl. the bottom
      bar) at exactly that point on a cold load.
    -->
    <!-- THEME_BOOT -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>CAROUSEL</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
