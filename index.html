<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#bfd6f8"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0d1520"
    />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>CAROUSEL</title>
    <script>
      (() => {
        const COLORS = { light: "#bfd6f8", dark: "#0d1520" };
        const STORAGE_KEY = "theme-mode";

        let mode = "auto";
        try {
          mode = localStorage.getItem(STORAGE_KEY) || "auto";
        } catch {}

        const isExplicit = mode === "light" || mode === "dark";
        const theme = isExplicit
          ? mode
          : window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light";

        const root = document.documentElement;
        root.setAttribute("data-theme", theme);

        root.style.backgroundColor = COLORS[theme];

        if (isExplicit) {
          document
            .querySelectorAll('meta[name="theme-color"]')
            .forEach((meta) => meta.setAttribute("content", COLORS[theme]));
        }
      })();
    </script>
    <script type="module" crossorigin src="/CarouselCC/assets/index-B0nsvHq4.js"></script>
    <link rel="stylesheet" crossorigin href="/CarouselCC/assets/index-D1oTNu_2.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
